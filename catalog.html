<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
            <header class="header">
    <a class="header__logo" href="#"><img class="header__logo-image" src="#" alt="Pixmart logo"></a>
    <nav class="header__navigation">
      <ul class="header__navigation-list">
        <li class="header__navigation-item header__navigation-item--active"><a class="header__navigation-link" href="#">About</a></li>
        <li class="header__navigation-item"><a class="header__navigation-link" href="blog-page.html">Products</a></li>
        <li class="header__navigation-item"><a class="header__navigation-link" href="#">Creators</a></li>
              <li class="header__navigation-item"><a class="header__navigation-link" href="#">Blog</a></li>
        <li class="header__navigation-item"><a class="header__navigation-link" href="#">Contact</a></li>
      </ul>
    </nav>
    <div class="header__actions">
      <form class="header__search">
        <input class="header__search-bar" type="search" name="search">
      </form>

      <a class="header__button button button" href="#">Shopping bag
     <img class="header__button-icon" src="#" alt="Shopping icon" />
      </a>
    </div>
    </header>

    <main class="main">
    <section class="catalog-banner">
      <h1 class="catalog-banner__title">Explore Top
<span class="catalog-banner__sub">UI Kits </span> Design Assets</h1>
    </section>

    <section class="catalog">

      <p class="catalog__select">Best Seller</p>

        <ul class="catalog__list">
          <li class="blog-article__tag-item">UI Kit</a></li>
          <li class="blog-article__tag-item">UI Kit</a></li>
        </ul>

           <p class="catalog__result">Showing 12 out of 120 results.</p>
           <article class="product-card">

           </article>

           <aside class="catalog-filters">
  <form class="catalog-filters__form" action="#" method="get">

    <!-- Categories -->
    <fieldset class="catalog-filters__group catalog-filters__group--categories">
      <legend class="catalog-filters__title">Categories</legend>

      <ul class="catalog-filters__list">
        <li class="catalog-filters__item">
          <label class="catalog-filters__control">
            <input
              class="catalog-filters__checkbox"
              type="checkbox"
              name="category[]"
              value="all"
              checked
            >
            <span class="catalog-filters__label">All Categories</span>
          </label>
        </li>

        <li class="catalog-filters__item">
          <label class="catalog-filters__control">
            <input
              class="catalog-filters__checkbox"
              type="checkbox"
              name="category[]"
              value="technology"
            >
            <span class="catalog-filters__label">Technology</span>
          </label>
        </li>

        <li class="catalog-filters__item">
          <label class="catalog-filters__control">
            <input
              class="catalog-filters__checkbox"
              type="checkbox"
              name="category[]"
              value="travel-tourism"
            >
            <span class="catalog-filters__label">Travel &amp; Tourism</span>
          </label>
        </li>

        <li class="catalog-filters__item">
          <label class="catalog-filters__control">
            <input
              class="catalog-filters__checkbox"
              type="checkbox"
              name="category[]"
              value="health-fitness"
            >
            <span class="catalog-filters__label">Health &amp; Fitness</span>
          </label>
        </li>

        <li class="catalog-filters__item">
          <label class="catalog-filters__control">
            <input
              class="catalog-filters__checkbox"
              type="checkbox"
              name="category[]"
              value="ecommerce"
            >
            <span class="catalog-filters__label">E-Commerce</span>
          </label>
        </li>

        <li class="catalog-filters__item">
          <label class="catalog-filters__control">
            <input
              class="catalog-filters__checkbox"
              type="checkbox"
              name="category[]"
              value="education"
            >
            <span class="catalog-filters__label">Education</span>
          </label>
        </li>

        <li class="catalog-filters__item">
          <label class="catalog-filters__control">
            <input
              class="catalog-filters__checkbox"
              type="checkbox"
              name="category[]"
              value="entertainment"
            >
            <span class="catalog-filters__label">Entertainment</span>
          </label>
        </li>

        <li class="catalog-filters__item">
          <label class="catalog-filters__control">
            <input
              class="catalog-filters__checkbox"
              type="checkbox"
              name="category[]"
              value="others"
            >
            <span class="catalog-filters__label">Others</span>
          </label>
        </li>
      </ul>
    </fieldset>

    <!-- Format Type -->
    <fieldset class="catalog-filters__group catalog-filters__group--format">
      <legend class="catalog-filters__title">Format Type</legend>

      <ul class="catalog-filters__list">
        <li class="catalog-filters__item">
          <label class="catalog-filters__control">
            <input
              class="catalog-filters__radio"
              type="radio"
              name="format"
              value="figma"
              checked
            >
            <span class="catalog-filters__label">Figma</span>
          </label>
        </li>

        <li class="catalog-filters__item">
          <label class="catalog-filters__control">
            <input
              class="catalog-filters__radio"
              type="radio"
              name="format"
              value="sketch"
            >
            <span class="catalog-filters__label">Sketch</span>
          </label>
        </li>

        <li class="catalog-filters__item">
          <label class="catalog-filters__control">
            <input
              class="catalog-filters__radio"
              type="radio"
              name="format"
              value="adobe-xd"
            >
            <span class="catalog-filters__label">Adobe XD</span>
          </label>
        </li>

        <li class="catalog-filters__item">
          <label class="catalog-filters__control">
            <input
              class="catalog-filters__radio"
              type="radio"
              name="format"
              value="photoshop"
            >
            <span class="catalog-filters__label">Adobe Photoshop</span>
          </label>
        </li>

        <li class="catalog-filters__item">
          <label class="catalog-filters__control">
            <input
              class="catalog-filters__radio"
              type="radio"
              name="format"
              value="illustration"
            >
            <span class="catalog-filters__label">Adobe Illustration</span>
          </label>
        </li>
      </ul>
    </fieldset>

    <!-- Style toggles -->
    <fieldset class="catalog-filters__group catalog-filters__group--style">
      <legend class="catalog-filters__title">Style</legend>

      <ul class="catalog-filters__list">

        <li class="catalog-filters__item">
          <label class="catalog-filters__toggle">
            <input
              class="catalog-filters__toggle-input"
              type="checkbox"
              name="style[]"
              value="minimalist"
              checked
            >
            <span class="catalog-filters__toggle-track"></span>
            <span class="catalog-filters__toggle-label">Minimalist</span>
          </label>
        </li>

        <li class="catalog-filters__item">
          <label class="catalog-filters__toggle">
            <input
              class="catalog-filters__toggle-input"
              type="checkbox"
              name="style[]"
              value="modern"
              checked
            >
            <span class="catalog-filters__toggle-track"></span>
            <span class="catalog-filters__toggle-label">Modern</span>
          </label>
        </li>

        <li class="catalog-filters__item">
          <label class="catalog-filters__toggle">
            <input
              class="catalog-filters__toggle-input"
              type="checkbox"
              name="style[]"
              value="playful"
            >
            <span class="catalog-filters__toggle-track"></span>
            <span class="catalog-filters__toggle-label">Playful</span>
          </label>
        </li>

        <li class="catalog-filters__item">
          <label class="catalog-filters__toggle">
            <input
              class="catalog-filters__toggle-input"
              type="checkbox"
              name="style[]"
              value="dark-mode"
              checked
            >
            <span class="catalog-filters__toggle-track"></span>
            <span class="catalog-filters__toggle-label">Dark Mode</span>
          </label>
        </li>

        <li class="catalog-filters__item">
          <label class="catalog-filters__toggle">
            <input
              class="catalog-filters__toggle-input"
              type="checkbox"
              name="style[]"
              value="photocentric"
            >
            <span class="catalog-filters__toggle-track"></span>
            <span class="catalog-filters__toggle-label">Photocentric</span>
          </label>
        </li>

      </ul>
    </fieldset>

    
      <button class="catalog-filters__clear-btn">
         Clear all filters
      </button>
    

  </form>
</aside>

</body>
</html>
