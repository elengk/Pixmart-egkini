<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
            <header class="header">
    <a class="header__logo" href="#"><img class="header__logo-image" src="#" alt="Pixmart logo"></a>
    <nav class="header__navigation">
      <ul class="header__navigation-list">
        <li class="header__navigation-item header__navigation-item--active"><a class="header__navigation-link" href="#">About</a></li>
        <li class="header__navigation-item"><a class="header__navigation-link" href="blog-page.html">Products</a></li>
        <li class="header__navigation-item"><a class="header__navigation-link" href="#">Creators</a></li>
              <li class="header__navigation-item"><a class="header__navigation-link" href="#">Blog</a></li>
        <li class="header__navigation-item"><a class="header__navigation-link" href="#">Contact</a></li>
      </ul>
    </nav>
    <div class="header__actions">
      <form class="header__search">
        <input class="header__search-bar" type="search" name="search">
      </form>

      <a class="header__button button button" href="#">Shopping bag
     <img class="header__button-icon" src="#" alt="Shopping icon" />
      </a>
    </div>
    </header>

    <main class="contac"></main>
    <section class="contact__section">
    <h1 class="contact__title">Get in Touch with Us</h1>
    <p class="contact__subtitle">We are here to help you navigate your creative journey. 
      Reach out for any questions, support, or feedback.</p>

       <a class="contact button button" href="#">Shop Now
     <img class="contact__button-icon" src="#" alt="Shopping icon" />
      </a>

      <p class="contact__phone">+1 (555) 123-4567</p>
       <p class="contact__email">support@pixmart.com</p>
        <p class="contact__time">Monday to Friday : 9 AM - 5 PM EST</p>

             <figure class="contact__figure">
          <img class="contact__image" src="#" alt="map" />
          <figcaption class="contact__caption"><span class="contact__caption-text">PixMart HQ </span> 
            123 Creative Ave, Design City, 45678</figcaption>
        </figure> 

        <form class="card" action="#" method="post">
    <div class="contact__field">
      <label for="full-name">Full Name</label>
      <input
        id="full-name"
        name="full-name"
        type="text"
        class="input"
        placeholder="Amelia Robert Johnson"
        required
      />
    </div>

    <div class="contact__field">
      <label for="email">Email Address</label>
      <input
        id="email"
        name="email"
        type="email"
        class="input"
        placeholder="amelia.robertjohnson@pixmart.com"
        required
      />
    </div>

    <div class="contact__field">
      <label for="subject">Subject</label>
      <select id="subject" name="subject">
        <option>General Inquiry</option>
      </select>
    </div>

    <div class="contact__field">
      <label for="message">Message</label>
      <textarea
        id="message"
        name="message"
        placeholder="Enter your message ..."
      ></textarea>
    </div>

    <div class="contact__field">
      <div class="contact__checkbox">
        <label class="checkbox">
          <input type="checkbox" name="newsletter" />
          <span>Subscribe me to Newsletter</span>
        </label>

        <label class="checkbox">
          <input type="checkbox" name="terms" checked />
          <span>I have read the User &amp; Privacy Policy</span>
        </label>
      </div>

      <button type="submit" class="btn-primary">
        Send Message
      </button>
    </div>
  </form>
    </section>
  </main>
</body>
</html>
